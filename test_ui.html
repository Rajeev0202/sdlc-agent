<!DOCTYPE html>
<html>
<head>
    <title>SDLC Agent - API Test</title>
    <style>
        body {
            font-family: system-ui;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #0a0e1a;
            color: #e6e9f0;
        }
        button {
            background: #5b9dff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 5px;
            font-size: 14px;
            font-weight: 600;
        }
        button:hover { background: #4a8de8; }
        #result {
            background: #1a1f2e;
            border: 1px solid #2a2f40;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 500px;
            overflow: auto;
        }
        .error { color: #ff6b6b; }
        .success { color: #3ecf8e; }
        h1 { color: #5b9dff; }
        .info { color: #f5a524; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🔧 SDLC Agent API Tester</h1>
    <p class="info">Use this page to test the API directly and see detailed error messages.</p>

    <div>
        <button onclick="testStage1()">Test Stage 1 (Card Freeze)</button>
        <button onclick="testStage1Alt()">Test Stage 1 (Payment Limits)</button>
        <button onclick="clearResult()">Clear</button>
    </div>

    <div id="result"></div>

    <script>
        const resultDiv = document.getElementById('result');

        function log(msg, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
            resultDiv.innerHTML += `<div class="${className}">[${timestamp}] ${msg}</div>`;
            resultDiv.scrollTop = resultDiv.scrollHeight;
        }

        function clearResult() {
            resultDiv.innerHTML = '';
        }

        async function testStage1(filename = 'brd_natwest_card_freeze.md') {
            clearResult();
            log(`Testing Stage 1 with: ${filename}`);
            log('Sending POST to /api/stage1...');

            try {
                const response = await fetch('http://localhost:5000/api/stage1', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ brd_filename: filename })
                });

                log(`Response status: ${response.status} ${response.statusText}`);

                const data = await response.json();

                if (response.ok) {
                    log('✓ Success!', 'success');
                    log(`Run ID: ${data.run_id}`, 'success');
                    log(`Brief Title: ${data.brief.title}`, 'success');
                    log(`Personas: ${data.brief.personas.length}`, 'success');
                    log(`Functional needs: ${data.brief.functional_needs.length}`, 'success');
                    log('\nFull response:', 'success');
                    log(JSON.stringify(data, null, 2), 'success');
                } else {
                    log('✗ Error!', 'error');
                    log(`Error: ${data.error || 'Unknown error'}`, 'error');
                    log('\nFull response:', 'error');
                    log(JSON.stringify(data, null, 2), 'error');
                }
            } catch (error) {
                log('✗ Network/Fetch Error!', 'error');
                log(`Error: ${error.message}`, 'error');
                log(`Full error: ${error.stack}`, 'error');
            }
        }

        function testStage1Alt() {
            testStage1('brd_payment_limits.md');
        }

        // Auto-run test on load
        log('Ready! Click a button to test the API.');
        log('Make sure Flask server is running on http://localhost:5000');
    </script>
</body>
</html>
