[project]
name = "sdlc-agent"
version = "0.1.0"
description = "End-to-end SDLC agent — Phase 1 (Claude Code)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sdlc_agent*"]
