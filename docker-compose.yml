version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: sdlc-redis
    ports:
      - "6379:6379"
    volumes:
      - sdlc-redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  sdlc-redis-data:
    driver: local
